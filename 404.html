<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>页面未找到</title>
    <meta http-equiv="refresh" content="3;url=/">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 50px; background: #f0f2f5; }
        .error-box { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        .error-code { color: #dc3545; font-size: 3rem; margin: 0; }
        .error-message { color: #666; margin: 1rem 0; }
        .home-link { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="error-box">
        <h1 class="error-code">404</h1>
        <p class="error-message">很抱歉，您访问的页面不存在</p>
        <p>页面将在3秒后自动跳转到首页，或 <a href="/" class="home-link">立即返回首页</a></p>
    </div>
</body>
</html>
